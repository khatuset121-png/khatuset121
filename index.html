<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Railway Booking Helper Hindi</title>
<style>
body{font-family:Arial,sans-serif;background:#f1f5f9;margin:0;padding:20px;color:#172554}
main{max-width:500px;margin:auto;background:white;padding:22px;border-radius:16px;box-shadow:0 4px 18px #cbd5e1}
h1{color:#087f5b;font-size:25px}
label{display:block;margin-top:14px;font-weight:bold}
input,select{width:100%;padding:12px;margin-top:6px;box-sizing:border-box;border:1px solid #cbd5e1;border-radius:8px;font-size:16px}
button,.link{display:block;width:100%;box-sizing:border-box;margin-top:16px;padding:13px;background:#087f5b;color:white;text-align:center;border:0;border-radius:8px;font-size:16px;text-decoration:none}
.note{font-size:13px;color:#64748b;line-height:1.5}
</style>
</head>
<body>
<main>
<h1>🚆 Railway Booking Helper</h1>
<p>अपनी ट्रेन यात्रा की जानकारी तैयार करें।</p>
<label>कहाँ से (स्टेशन कोड या नाम)</label>
<input id="from" placeholder="जैसे PNBE">
<label>कहाँ तक (स्टेशन कोड या नाम)</label>
<input id="to" placeholder="जैसे JP">
<label>यात्रा की तारीख</label>
<input id="date" type="date">
<label>क्लास</label>
<select id="class">
<option>SL - Sleeper</option>
<option>3A - AC 3 Tier</option>
<option>2A - AC 2 Tier</option>
<option>CC - Chair Car</option>
<option>2S - Second Sitting</option>
</select>
<button onclick="prepare()">यात्रा की जानकारी तैयार करें</button>
<p id="result"></p>
<a class="link" href="https://www.irctc.co.in/" target="_blank" rel="noopener">आधिकारिक IRCTC वेबसाइट खोलें</a>
<p class="note">यह सहायक टूल है, टिकट बुक नहीं करता। अपना पासवर्ड, OTP या भुगतान की जानकारी यहाँ न डालें।</p>
</main>
<script>
function prepare(){
 const from=document.getElementById('from').value.trim();
 const to=document.getElementById('to').value.trim();
 const date=document.getElementById('date').value;
 const cls=document.getElementById('class').value;
 const result=document.getElementById('result');
 if(!from||!to||!date){result.textContent='कृपया स्टेशन और यात्रा की तारीख भरें।';return;}
 result.textContent='यात्रा: '+from.toUpperCase()+' से '+to.toUpperCase()+' | तारीख: '+date+' | क्लास: '+cls+'. अब IRCTC पर जाकर उपलब्धता जाँचें।';
}
</script>
</body>
</html>
